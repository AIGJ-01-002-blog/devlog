# 언어별 README(한·영·일·중)와 조직 프로필이 저장소와 맞는지 확인한다. 검사 내용은 scripts/check-readmes.py 맨 위에 있다.
name: README 검사

# 언제 도나: PR과 main·develop push에서 README·CHANGELOG·버전이 적힌 파일(pom.xml, package.json, 마이그레이션)이
#           바뀌었을 때. 버전이 바뀌면 README 표도 같이 바뀌어야 해서 코드 파일도 경로에 들어 있다
on:
  pull_request:
    paths: &paths
      - "README*.md"
      - "CHANGELOG.md"
      - "assets/images/**"
      - "app/backend/pom.xml"
      - "app/backend/src/main/resources/db/migration/**"
      - "app/frontend/package.json"
      - "scripts/check-readmes.py"
      - "profile/**"
      - "scripts/build-org-profile.py"
      - ".github/workflows/readme-check.yml"
  push:
    branches: [main, develop]
    # 위 &paths 목록을 그대로 다시 쓴다(YAML 앵커·별칭)
    paths: *paths

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # 검사 스크립트 하나만 돈다. 어긋난 곳이 있으면 실패하고 무엇이 다른지 로그에 남긴다
      - run: python3 scripts/check-readmes.py
