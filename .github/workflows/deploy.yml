name: 블로그 배포
# 문서(*.md)와 Oracle VM 준비 스크립트만 바뀌면 배포하지 않는다. 설계 문서는 AIGJ-01-002-blog/docs 저장소에 둔다.
# 운영 배포는 main에서만 한다. main 푸시는 백엔드·화면 테스트를 이 워크플로 안에서 다시 돌리고, 둘 다 통과해야 클러스터에 배포한다(CONTRIBUTING.md).
# develop 푸시는 같은 테스트를 거쳐 시험 환경(네임스페이스 blog-dev, overlays/staging)에 배포한다. 저장소 변수 STAGING_ENABLED=true일 때만 (spec 092, #170).

on:
  pull_request:
    paths: ["deploy/**", "app/**", ".github/workflows/deploy.yml", "!**/*.md", "!deploy/scripts/server-setup.sh"]
  push:
    branches: [main, develop]
    paths: ["deploy/**", "app/**", ".github/workflows/deploy.yml", "!**/*.md", "!deploy/scripts/server-setup.sh"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "클러스터에 배포 (BLOG_SECRET_ENV Secret 필요)"
        type: boolean
        default: false
      target:
        description: "school = 학교 실습 서버 k3d(SCHOOL_SSH_PASSWORD, SSH 터널) / oracle = KUBECONFIG Secret의 클러스터"
        type: choice
        options: [school, oracle]
        default: school
      overlay:
        description: "selfhosted = DB·Redis·MinIO를 클러스터 안에 띄움 / nhn = 학교 공용 서버 사용(학교망에서만 닿음)"
        type: choice
        options: [selfhosted, nhn]
        default: selfhosted
      staging:
        description: "이 브랜치를 시험 환경(blog-dev)에 배포 (운영 배포와 따로, 변수 STAGING_ENABLED=true일 때만)"
        type: boolean
        default: false
      rollback_test:
        description: "존재하지 않는 이미지로 롤백 테스트 (배포는 실패하고 직전 버전으로 돌아가야 정상)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # GHCR 이미지 이름은 소문자만 된다 (조직 이름 AIGJ-01-002-blog → aigj-01-002-blog)
  IMAGE_NAME: blog-app
  KUSTOMIZE_VERSION: "5.7.1"
  KUBECONFORM_VERSION: "0.7.0"

jobs:
  # main에 합쳐진 결과(여러 PR이 잇따라 머지된 상태)를 배포 전에 한 번 더 테스트한다. PR에서는 backend-ci·화면 CI가 따로 돈다
  backend-test:
    name: 백엔드 테스트
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit

  frontend-test:
    name: 화면 테스트
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/frontend-ci.yml

  validate:
    name: 매니페스트 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 도구 설치
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin kubeconform
      - name: 비밀값이 커밋되지 않았는지 확인
        run: deploy/scripts/check-no-secrets.sh
      - name: 바깥에 열리는 환경에서 개발용 로그인이 꺼져 있는지 확인
        run: |
          # 개발용 로그인은 비밀번호 없이 아무 계정으로 들어간다. 로컬(overlays/local) 말고는 켜지 않는다 (spec 092 FR-008)
          # 스프링은 true를 대소문자 없이 읽으므로(tRuE도 켜짐) 검사도 대소문자를 가리지 않는다
          if grep -niE '^DEV_LOGIN_ENABLED=(true|1|yes|on)' deploy/k8s/overlays/{nhn,selfhosted,staging}/app.env; then
            echo "::error::개발용 로그인(DEV_LOGIN_ENABLED)은 local overlay에서만 켤 수 있습니다"; exit 1
          fi
      - name: kustomize 빌드 + 스키마 검사
        run: |
          # secret.env는 커밋하지 않으므로 예시 파일로 빌드만 확인한다
          for o in nhn selfhosted staging; do cp "deploy/k8s/overlays/$o/secret.env.example" "deploy/k8s/overlays/$o/secret.env"; done
          for o in local nhn selfhosted staging; do
            kustomize build "deploy/k8s/overlays/$o" | kubeconform -strict -summary -kubernetes-version 1.33.0 -
          done
          kustomize build deploy/k8s/addons/cloudflare-tunnel | kubeconform -strict -summary -kubernetes-version 1.33.0 -
          kustomize build deploy/k8s/addons/kubernetes-dashboard | kubeconform -strict -summary -kubernetes-version 1.33.0 -

  image:
    name: 이미지 빌드
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 이미지 이름 정하기
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          # latest는 main(운영)만, develop 태그는 develop만 가리킨다. 다른 브랜치를 수동 실행하면 커밋 SHA 태그만 단다(빈 줄은 무시됨)
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
            ${{ github.ref == 'refs/heads/develop' && format('{0}:develop', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 클러스터 배포
    # 이미지와 두 테스트가 모두 성공해야 배포한다
    needs: [image, backend-test, frontend-test]
    # main에 머지되면 학교 서버(selfhosted)에 자동 배포한다. 끄려면 저장소 변수 AUTO_DEPLOY=false
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy && !inputs.staging) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY != 'false')
    runs-on: ubuntu-latest
    environment: ${{ inputs.overlay || 'selfhosted' }}   # 보호 규칙(승인자)을 걸 수 있다
    # 머지가 잇따르면 배포가 겹치지 않게 차례로 돈다
    concurrency:
      group: deploy-cluster
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      OVERLAY: ${{ inputs.overlay || 'selfhosted' }}
      TARGET: ${{ inputs.target || 'school' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 이미지 이름 정하기
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
      - name: 도구 설치
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin
      - name: 학교 서버 SSH 터널 (target=school)
        if: env.TARGET == 'school'
        uses: ./.github/actions/school-tunnel
        with:
          known-hosts: ${{ vars.SCHOOL_SSH_KNOWN_HOSTS }}
          host: ${{ vars.SCHOOL_SSH_HOST }}
          ssh-port: ${{ vars.SCHOOL_SSH_PORT }}
          user: ${{ vars.SCHOOL_SSH_USER }}
          api-port: ${{ vars.SCHOOL_K8S_API_PORT }}
          password: ${{ secrets.SCHOOL_SSH_PASSWORD }}
      - name: 접속 정보 준비 (파일은 러너에만 존재)
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          BLOG_SECRET_ENV: ${{ secrets.BLOG_SECRET_ENV }}
          # 따로 넣은 Secret이 있으면 BLOG_SECRET_ENV의 같은 이름 값을 덮어쓴다 (예: Gmail 앱 비밀번호만 따로 등록)
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # 비밀번호가 있을 때만 SMTP를 켠다. 없으면 빈 값이라 덮어쓰지 않고, 앱은 메일을 보관만 한다
          SMTP_HOST: ${{ secrets.SMTP_PASSWORD != '' && 'smtp.gmail.com' || '' }}
          # 앱 텔레그램 봇(023). 따로 만든 봇이 없으면 배포 알림 봇을 같이 쓴다
          TELEGRAM_BOT_TOKEN: ${{ secrets.APP_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          # AI(018·061): Gemini 열쇠, 집 PC Ollama 주소(변수)와 그 앞 Cloudflare Access 서비스 토큰.
          # 주소가 비면 Ollama를 쓰지 않는다(앱은 Gemini만 씀)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          OLLAMA_ACCESS_CLIENT_ID: ${{ secrets.OLLAMA_ACCESS_CLIENT_ID }}
          OLLAMA_ACCESS_CLIENT_SECRET: ${{ secrets.OLLAMA_ACCESS_CLIENT_SECRET }}
          OLLAMA_AUTH_TOKEN: ${{ secrets.OLLAMA_AUTH_TOKEN }}
          # 구글 로그인(004): 값이 있으면 BLOG_SECRET_ENV의 같은 값을 덮어쓴다. 여기와 BLOG_SECRET_ENV 둘 다 GOOGLE_CLIENT_ID가 없을 때만 Google 버튼이 숨는다
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # 카카오 로그인(080): 구글과 같다. 비즈 앱 전환 전이면 변수 KAKAO_SCOPES로 이메일 동의항목을 뺀다
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_SCOPES: ${{ vars.KAKAO_SCOPES }}
          # Facebook 로그인(083): 구글과 같다
          FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          # 네이버 로그인(096): 구글과 같다
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 숏폼 렌더 워커 토큰(099·#241). 바꾸는 동안만 옛 값을 _PREVIOUS에 둔다
          SHORTS_WORKER_TOKEN: ${{ secrets.SHORTS_WORKER_TOKEN }}
          SHORTS_WORKER_TOKEN_PREVIOUS: ${{ secrets.SHORTS_WORKER_TOKEN_PREVIOUS }}
        run: |
          umask 077
          # oracle은 KUBECONFIG Secret을 쓴다. school은 앞 단계가 SSH로 받아 둔 파일을 쓴다
          if [ "$TARGET" != school ]; then
            printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
            echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          fi
          f="deploy/k8s/overlays/$OVERLAY/secret.env"
          printf '%s\n' "$BLOG_SECRET_ENV" > "$f"
          for key in SMTP_PASSWORD SMTP_HOST TELEGRAM_BOT_TOKEN GEMINI_API_KEY OLLAMA_BASE_URL OLLAMA_ACCESS_CLIENT_ID OLLAMA_ACCESS_CLIENT_SECRET OLLAMA_AUTH_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET KAKAO_SCOPES FACEBOOK_CLIENT_ID FACEBOOK_CLIENT_SECRET NAVER_CLIENT_ID NAVER_CLIENT_SECRET SHORTS_WORKER_TOKEN SHORTS_WORKER_TOKEN_PREVIOUS; do
            val="${!key}"
            [ -n "$val" ] || continue
            grep -v "^${key}=" "$f" > "$f.tmp" || true
            printf '%s=%s\n' "$key" "$val" >> "$f.tmp"
            mv "$f.tmp" "$f"
          done
          # 변수 OLLAMA_BASE_URL이 비면 BLOG_SECRET_ENV에 남은 옛 주소도 지워 Ollama를 끈다(README 설명과 같게)
          if [ -z "$OLLAMA_BASE_URL" ]; then
            grep -v '^OLLAMA_BASE_URL=' "$f" > "$f.tmp" || true
            mv "$f.tmp" "$f"
          fi
      - name: 이미지 받기 권한 (GHCR 비공개 이미지)
        env:
          # 클러스터가 나중에 파드를 다시 띄울 때도 받을 수 있게 만료 없는 토큰(read:packages)을 권장. 없으면 이번 실행 토큰으로 대신한다
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER || github.actor }}
        run: |
          kubectl get ns blog >/dev/null 2>&1 || kubectl create ns blog
          umask 077
          trap 'rm -f "$RUNNER_TEMP/ghcr-token"' EXIT
          printf '%s' "$GHCR_PULL_TOKEN" > "$RUNNER_TEMP/ghcr-token"
          kubectl -n blog create secret docker-registry ghcr-pull --docker-server=ghcr.io \
            --docker-username="$GHCR_PULL_USER" --docker-password="$(cat "$RUNNER_TEMP/ghcr-token")" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$RUNNER_TEMP/ghcr-token"
      - name: 배포 (헬스 체크 실패 시 직전 버전으로 자동 롤백)
        env:
          ROLLBACK_TEST: ${{ inputs.rollback_test || 'false' }}
          ROLLOUT_TIMEOUT: ${{ vars.ROLLOUT_TIMEOUT_SECONDS || '300' }}
        run: deploy/scripts/rollout.sh
      - name: 도메인 연결 (Cloudflare Tunnel, Secret CLOUDFLARE_TUNNEL_TOKEN이 있을 때만)
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "CLOUDFLARE_TUNNEL_TOKEN이 없어 도메인 연결을 건너뜁니다."
            exit 0
          fi
          # 토큰은 명령줄에 남지 않게 러너 임시 파일로만 넘긴다
          umask 077
          trap 'rm -f "$RUNNER_TEMP/tunnel-token"' EXIT
          printf '%s' "$CLOUDFLARE_TUNNEL_TOKEN" > "$RUNNER_TEMP/tunnel-token"
          kubectl -n blog create secret generic cloudflared-token --from-file=token="$RUNNER_TEMP/tunnel-token" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$RUNNER_TEMP/tunnel-token"
          kustomize build deploy/k8s/addons/cloudflare-tunnel | kubectl apply --server-side --force-conflicts -f -
          # 학교망처럼 UDP(QUIC)가 막히면 cloudflared가 http2로 넘어가는 데 시간이 걸린다. 넉넉히 기다리고, 실패하면 원인을 로그에 남긴다(토큰은 찍히지 않음)
          if ! kubectl -n blog rollout status deploy/cloudflared --timeout=300s; then
            kubectl -n blog get pods -l app.kubernetes.io/name=cloudflared -o wide || true
            kubectl -n blog describe pods -l app.kubernetes.io/name=cloudflared | sed -n '/^Events:/,$p' || true
            kubectl -n blog logs -l app.kubernetes.io/name=cloudflared --tail=40 --prefix --all-containers || true
            exit 1
          fi
      - name: 운영 대시보드 (학교 서버, 읽기 전용 로그인)
        if: env.TARGET == 'school'
        continue-on-error: true
        run: |
          # 바깥 주소는 Cloudflare에서 Access(이메일 인증)로 막아 연결한다(deploy/README.md "운영 대시보드"). 실패해도 블로그 배포는 성공으로 둔다
          kustomize build deploy/k8s/addons/kubernetes-dashboard | kubectl apply --server-side --force-conflicts -f -
          # 읽기 계정은 이제 blog 네임스페이스 RoleBinding만 쓴다. apply는 옛 것을 지우지 않으므로 클러스터 전체 읽기 바인딩을 직접 지운다(#375)
          kubectl delete clusterrolebinding devlog-viewer --ignore-not-found
          kubectl -n kubernetes-dashboard rollout status deploy/kubernetes-dashboard --timeout=180s \
            || echo "::warning::운영 대시보드가 아직 준비되지 않았습니다(블로그 배포에는 영향 없음)"
      - name: 정리
        if: always()
        run: |
          rm -f "deploy/k8s/overlays/$OVERLAY/secret.env" "$RUNNER_TEMP/kubeconfig" "$RUNNER_TEMP/tunnel-token" "$RUNNER_TEMP/ghcr-token"
          pkill -f 'ssh .*-L 16443:' || true
      - name: 알림 (Discord·텔레그램)
        if: always() && (vars.DISCORD_ENABLED == 'true' || vars.TELEGRAM_ENABLED == 'true')
        uses: ./.github/actions/notify
        with:
          discord-webhook-url: ${{ vars.DISCORD_ENABLED == 'true' && secrets.DISCORD_WEBHOOK_URL || '' }}
          telegram-bot-token: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          telegram-chat-id: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_CHAT_ID || '' }}
          title: "${{ vars.SERVICE_NAME || github.event.repository.name }} 배포 ${{ job.status == 'success' && '성공' || '실패(직전 버전으로 롤백 시도)' }}"
          description: "${{ env.TARGET }} · ${{ env.OVERLAY }} · 커밋 ${{ github.sha }} · 실행자 ${{ github.actor }}"
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy-staging:
    name: 시험 환경 배포
    # develop에 머지되면 테스트와 이미지가 통과한 커밋을 시험 환경에 올린다. 운영(blog)과 데이터·비밀값을 나눈다
    needs: [image, backend-test, frontend-test]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.staging && vars.STAGING_ENABLED == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.STAGING_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: staging
    # 운영 배포와 겹치지 않게 같은 줄에 선다
    concurrency:
      group: deploy-cluster
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      OVERLAY: staging
      NAMESPACE: blog-dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 이미지 이름 정하기
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
      - name: 도구 설치
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin
      - name: 학교 서버 SSH 터널
        uses: ./.github/actions/school-tunnel
        with:
          known-hosts: ${{ vars.SCHOOL_SSH_KNOWN_HOSTS }}
          host: ${{ vars.SCHOOL_SSH_HOST }}
          ssh-port: ${{ vars.SCHOOL_SSH_PORT }}
          user: ${{ vars.SCHOOL_SSH_USER }}
          api-port: ${{ vars.SCHOOL_K8S_API_PORT }}
          password: ${{ secrets.SCHOOL_SSH_PASSWORD }}
      - name: 시험 환경 비밀값 (처음 한 번 만들고 클러스터에 보관)
        run: |
          kubectl get ns "$NAMESPACE" >/dev/null 2>&1 || kubectl create ns "$NAMESPACE"
          umask 077
          f="deploy/k8s/overlays/$OVERLAY/secret.env"
          # DB·MinIO는 처음 만든 비밀번호로 초기화되므로 매번 새로 만들면 안 된다. blog-dev-seed에 두고 다시 쓴다
          if kubectl -n "$NAMESPACE" get secret blog-dev-seed >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" get secret blog-dev-seed -o jsonpath='{.data.secret\.env}' | base64 -d > "$f"
          else
            # 씨앗 없이 DB 볼륨만 남았으면 새 비밀번호로는 붙지 못한다. 덮어쓰지 말고 멈춘다
            if kubectl -n "$NAMESPACE" get pvc data-postgres-0 >/dev/null 2>&1; then
              echo "::error::blog-dev-seed가 없는데 DB 볼륨(data-postgres-0)이 남아 있습니다. 네임스페이스 blog-dev를 지우고 다시 실행하세요"
              exit 1
            fi
            deploy/scripts/gen-secret-env.sh "$OVERLAY"
            kubectl -n "$NAMESPACE" create secret generic blog-dev-seed --from-file=secret.env="$f"
          fi
          [ -s "$f" ] || { echo "::error::시험 환경 비밀값을 만들지 못했습니다"; exit 1; }
      - name: 이미지 받기 권한 (GHCR 비공개 이미지)
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER || github.actor }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/ghcr-token"' EXIT
          printf '%s' "$GHCR_PULL_TOKEN" > "$RUNNER_TEMP/ghcr-token"
          kubectl -n "$NAMESPACE" create secret docker-registry ghcr-pull --docker-server=ghcr.io \
            --docker-username="$GHCR_PULL_USER" --docker-password="$(cat "$RUNNER_TEMP/ghcr-token")" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: 배포 (헬스 체크 실패 시 직전 버전으로 자동 롤백)
        env:
          ROLLOUT_TIMEOUT: ${{ vars.ROLLOUT_TIMEOUT_SECONDS || '300' }}
        run: deploy/scripts/rollout.sh
      - name: 정리
        if: always()
        run: |
          rm -f "deploy/k8s/overlays/$OVERLAY/secret.env" "$RUNNER_TEMP/kubeconfig" "$RUNNER_TEMP/ghcr-token"
          pkill -f 'ssh .*-L 16443:' || true
      - name: 알림 (Discord·텔레그램)
        if: always() && (vars.DISCORD_ENABLED == 'true' || vars.TELEGRAM_ENABLED == 'true')
        uses: ./.github/actions/notify
        with:
          discord-webhook-url: ${{ vars.DISCORD_ENABLED == 'true' && secrets.DISCORD_WEBHOOK_URL || '' }}
          telegram-bot-token: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          telegram-chat-id: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_CHAT_ID || '' }}
          title: "${{ vars.SERVICE_NAME || github.event.repository.name }} 시험 환경 배포 ${{ job.status == 'success' && '성공' || '실패(직전 버전으로 롤백 시도)' }}"
          description: "blog-dev · 커밋 ${{ github.sha }} · 실행자 ${{ github.actor }}"
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
