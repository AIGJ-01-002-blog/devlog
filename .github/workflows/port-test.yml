# 학교 안에서 학교 서버 포트로 바로 붙을 수 있는지 보는 시험 페이지 (민서님 결정 2026-10-13 "학교 안 시험").
# 내 포트 범위 끝(API 포트가 든 10개 묶음의 +9, 지금 8319)에 작은 웹 서버 컨테이너를 2시간만 띄운다. 운영 클러스터는 건드리지 않는다.
# 페이지는 이 서버(포트 직접)와 devlog.life(Cloudflare)에 각각 10번씩 요청해 걸린 시간을 보여 준다.
name: 학교 안 포트 시험

on:
  workflow_dispatch:
    inputs:
      action:
        description: start(2시간 띄움) 또는 stop(바로 끔)
        default: start
  push:
    branches: [feature/my-page-image-delay-ubedyo]
    paths: [.github/workflows/port-test.yml]

permissions:
  contents: read

concurrency:
  group: school-server
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ vars.SCHOOL_SSH_HOST }}
      SSH_PORT: ${{ vars.SCHOOL_SSH_PORT }}
      SSH_USER: ${{ vars.SCHOOL_SSH_USER }}
      API_PORT: ${{ vars.SCHOOL_K8S_API_PORT }}
      ACTION: ${{ inputs.action || 'start' }}
    steps:
      - name: 시험 페이지 켜기·끄기
        env:
          KNOWN_HOSTS: ${{ vars.SCHOOL_SSH_KNOWN_HOSTS }}
          SSHPASS: ${{ secrets.SCHOOL_SSH_PASSWORD }}
        run: |
          # 학교 서버 SSH 키를 저장소 변수 SCHOOL_SSH_KNOWN_HOSTS로 고정한다. 변수가 없으면 붙지 않는다
          if [ -n "$KNOWN_HOSTS" ]; then mkdir -p ~/.ssh && printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts; HKC=yes
          else echo "::error::변수 SCHOOL_SSH_KNOWN_HOSTS가 없어 학교 서버 SSH 키를 확인할 수 없습니다. 확인 안 된 서버에는 비밀번호를 보내지 않습니다"; exit 1; fi
          [ -n "$SSHPASS" ] || { echo "::error::Secret SCHOOL_SSH_PASSWORD가 없습니다"; exit 1; }
          case "$ACTION" in start|stop) ;; *) echo "::error::action은 start 또는 stop"; exit 1;; esac
          PORT=$((API_PORT - API_PORT % 10 + 9))
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=$HKC -o ConnectTimeout=15 \
            "$SSH_USER@$HOST" "PORT=$PORT ACTION=$ACTION bash -s" <<'EOF'
          set -eu
          docker rm -f devlog-port-test >/dev/null 2>&1 || true
          [ "$ACTION" = stop ] && { echo "시험 페이지를 껐어요"; exit 0; }
          if ss -Hltn "sport = :$PORT" | grep -q .; then echo "::error::$PORT를 이미 누가 쓰고 있어요"; exit 1; fi
          dir=$(mktemp -d)
          cat > "$dir/index.html" <<'HTML'
          <!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>devlog 포트 직접 시험</title>
          <style>body{font:16px/1.6 system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left}b{color:#0a7}</style></head>
          <body><h1>열렸어요 👋</h1><p>이 페이지가 보이면 지금 있는 곳에서 학교 서버 포트로 바로 붙을 수 있어요. 아래 시간을 재는 동안 잠시만 기다려 주세요.</p>
          <table><thead><tr><th>어디로</th><th>가운데값</th><th>가장 빠름</th></tr></thead><tbody id="t"></tbody></table>
          <p id="done"></p>
          <script>
          async function time(url){const r=[];for(let i=0;i<10;i++){const s=performance.now();try{await fetch(url+(url.includes('?')?'&':'?')+'n='+i+Math.random(),{mode:'no-cors',cache:'no-store'})}catch(e){r.push(NaN);continue}r.push(performance.now()-s)}const ok=r.filter(x=>!isNaN(x)).sort((a,b)=>a-b);return ok.length?{p50:ok[Math.floor((ok.length-1)/2)],min:ok[0]}:null}
          (async()=>{const rows=[['학교 서버 포트 직접',location.origin+'/ping.txt'],['devlog.life (Cloudflare)','https://devlog.life/favicon.svg']];const t=document.getElementById('t');
          for(const [n,u] of rows){const v=await time(u);t.insertAdjacentHTML('beforeend','<tr><td>'+n+'</td><td><b>'+(v?v.p50.toFixed(0)+'ms':'실패')+'</b></td><td>'+(v?v.min.toFixed(0)+'ms':'-')+'</td></tr>')}
          document.getElementById('done').textContent='다 쟀어요. 이 화면을 캡처해서 보내 주세요.'})()
          </script></body></html>
          HTML
          echo ok > "$dir/ping.txt"
          docker run -d --name devlog-port-test --rm -p "0.0.0.0:$PORT:8080" -v "$dir:/www:ro" --memory 32m --read-only \
            busybox:1.36 sh -c 'timeout 7200 httpd -f -p 8080 -h /www' >/dev/null
          sleep 2
          curl -s -o /dev/null -w "서버 안에서 확인: %{http_code}\n" "http://127.0.0.1:$PORT/"
          echo "주소: http://$(hostname -f 2>/dev/null || hostname):$PORT/ (2시간 뒤 자동으로 꺼져요)"
          EOF
      - name: 학교 밖에서 열리는지
        if: env.ACTION == 'start'
        run: |
          PORT=$((API_PORT - API_PORT % 10 + 9))
          curl -s -m 8 -o /dev/null -w "학교 밖(GitHub)에서: %{http_code} %{time_total}s\n" "http://$HOST:$PORT/" || echo "학교 밖(GitHub)에서: 연결 안 됨"
