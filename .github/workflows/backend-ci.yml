# 블로그 앱(app/backend) 빌드와 테스트. Testcontainers가 PostgreSQL 16·Redis 7을 직접 띄운다(GitHub 러너의 Docker 사용).
name: backend-ci

# ─── 동작 요약 ───────────────────────────────────────────────
# 언제 도나: ① PR에서 app/backend나 이 파일이 바뀌었을 때
#           ② develop에 push될 때(= feature PR이 머지될 때), 같은 경로 조건
#           ③ 블로그 배포(deploy.yml)가 main·develop 배포 전에 이 파일을 불러 쓸 때(workflow_call)
# 흐름: 코드 받기 → Java 21 준비 → mvnw verify(테스트 + JaCoCo 줄 커버리지 40% 검사)
#       → 커버리지 보고서 올리기 → (켜져 있으면) SonarQube 분석 → 실패 시 테스트 보고서 올리기
# 결과: 여기서 빨간불이면 PR을 머지하지 않는다. 배포 안에서 불렸을 때 실패하면 배포 job이 시작되지 않는다.
# ────────────────────────────────────────────────────────────
on:
  pull_request:
    paths:
      - "app/backend/**"
      - ".github/workflows/backend-ci.yml"
  # main은 블로그 배포(deploy.yml)가 이 워크플로를 불러 배포 전에 테스트한다. 여기서는 develop만 본다
  push:
    branches: [develop]
    paths:
      - "app/backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_call:

# 최소 권한: 코드를 읽기만 한다. 테스트에 쓰기 권한은 필요 없다
permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 앞 실행을 취소해 최신 커밋만 검사한다(러너 시간 절약)
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job 하나(test)에서 단계가 위에서 아래로 차례로 돈다. 앞 단계가 실패하면 뒤 단계는 건너뛴다(if: always()/failure() 단계 빼고)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # run 명령은 모두 app/backend 폴더에서 실행한다
    defaults:
      run:
        working-directory: app/backend
    steps:
      # 1) 저장소 코드를 러너로 받는다
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # SonarQube가 줄별 작성자(blame)를 읽게 전체 이력을 받는다
      # 2) Java 21(Temurin)을 깔고 Maven 의존성을 캐시해 다음 실행을 빠르게 한다
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # 3) 핵심 단계. verify = 컴파일 → 단위·통합 테스트 → JaCoCo 커버리지 검사(pom.xml에 기준 40%).
      #    테스트가 하나라도 실패하거나 줄 커버리지가 40% 미만이면 여기서 빨간불이 된다
      - name: 테스트 + 커버리지 기준 (줄 40%)
        run: ./mvnw -B -ntp verify
      # 4) 성공·실패와 상관없이(always) 커버리지 HTML 보고서를 Actions 화면에서 내려받게 올린다
      - name: 커버리지 보고서
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: app/backend/target/site/jacoco
          if-no-files-found: ignore
      # 5) 코드 품질 분석. develop push일 때만 돈다(PR에서는 돌지 않음)
      # 레포 변수 SONAR_ENABLED=true이고 SONAR_TOKEN이 있을 때만. 기본은 SonarCloud(https://sonarcloud.io, 변수 SONAR_ORGANIZATION 필요),
      # 학교 SonarQube를 쓰려면 Secret SONAR_HOST_URL=http://s4.java21.net:9000
      # 품질 서버(학교 SonarQube 등)가 내려가 있어도 빌드·테스트 결과(CI 초록)는 막지 않는다. 실패는 경고로만 남는다
      - name: SonarQube 분석
        id: sonar
        if: vars.SONAR_ENABLED == 'true' && github.event_name == 'push'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "SONAR_TOKEN이 없어 건너뜁니다."; exit 0; fi
          org=()
          if [ -n "$SONAR_ORGANIZATION" ]; then org=("-Dsonar.organization=$SONAR_ORGANIZATION"); fi
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            "${org[@]}" \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'aigj-01-002-blog' }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
      # CI 결과 알림(ci-notify)은 "통과"만 보내므로 Sonar 실패는 따로 경고로 알린다
      - name: SonarQube 실패 알림
        if: steps.sonar.outcome == 'failure' && (vars.DISCORD_ENABLED == 'true' || vars.TELEGRAM_ENABLED == 'true')
        uses: ./.github/actions/notify
        with:
          discord-webhook-url: ${{ vars.DISCORD_ENABLED == 'true' && secrets.DISCORD_WEBHOOK_URL || '' }}
          telegram-bot-token: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          telegram-chat-id: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_CHAT_ID || '' }}
          title: "backend-ci SonarQube 분석 실패"
          description: "빌드·테스트는 통과했고 SonarQube 분석만 실패했습니다."
          status: failure
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # 6) 테스트가 실패했을 때만 surefire 보고서(어느 테스트가 왜 실패했는지)를 올린다
      - name: 실패한 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: app/backend/target/surefire-reports
