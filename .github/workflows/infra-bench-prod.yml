# 운영 학교 서버의 지금 구성이 쓰는 자원과 단계별 응답 시간을 읽기 전용으로 잰다 (issue #172, deploy/scripts/infra-bench-prod.sh).
# 서버 안에서는 아무것도 만들거나 바꾸지 않는다. 수동 실행(Actions → 운영 구성 측정) 또는 측정 스크립트를 고친 푸시.
name: 운영 구성 측정

on:
  workflow_dispatch:
  push:
    branches: [feature/my-page-image-delay-ubedyo, feature/094-light-infra-benchmark]
    paths: [deploy/scripts/infra-bench-prod.sh, .github/workflows/infra-bench-prod.yml]

permissions:
  contents: read

concurrency:
  group: school-server
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ vars.SCHOOL_SSH_HOST }}
      SSH_PORT: ${{ vars.SCHOOL_SSH_PORT }}
      SSH_USER: ${{ vars.SCHOOL_SSH_USER }}
      SSHPASS: ${{ secrets.SCHOOL_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: 운영 서버 측정(읽기 전용)
        env:
          KNOWN_HOSTS: ${{ vars.SCHOOL_SSH_KNOWN_HOSTS }}
        run: |
          # 학교 서버 SSH 키를 저장소 변수 SCHOOL_SSH_KNOWN_HOSTS로 고정한다. 변수가 없으면 붙지 않는다
          if [ -n "$KNOWN_HOSTS" ]; then mkdir -p ~/.ssh && printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts; HKC=yes
          else echo "::error::변수 SCHOOL_SSH_KNOWN_HOSTS가 없어 학교 서버 SSH 키를 확인할 수 없습니다. 확인 안 된 서버에는 비밀번호를 보내지 않습니다"; exit 1; fi
          [ -n "$SSHPASS" ] || { echo "::error::Secret SCHOOL_SSH_PASSWORD가 없습니다"; exit 1; }
          set -o pipefail  # ssh가 실패하면 tee가 성공해도 단계가 실패하게
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=$HKC -o ConnectTimeout=15 \
            "$SSH_USER@$HOST" 'bash -s' < deploy/scripts/infra-bench-prod.sh | tee result.txt
          { echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 러너(미국)에서 공개 주소
        run: |
          for p in /favicon.svg /api/auth/me /api/members/kim755030/posts; do
            # 2xx·3xx만 표본으로 쓰고 나머지는 fail로 센다
            printf '%-32s ' "$p"; for i in $(seq 20); do curl -s -o /dev/null -w '%{http_code} %{time_starttransfer}\n' "https://devlog.life$p" || :; done \
              | awk '$1>=200 && $1<400 {print $2; next} {f++} END {if (f) print "FAIL " f}' | sort -n \
              | awk '/^FAIL/ {f=$2; next} {a[++n]=$1*1000} END {if (n==0) {printf "(성공한 요청 없음) fail=%d\n", f; exit} m=(n%2)?a[(n+1)/2]:(a[n/2]+a[n/2+1])/2; i=int(n*0.95); if (i<n*0.95) i++; printf "ttfb p50=%.0f p95=%.0f n=%d fail=%d\n", m, a[i], n, f}'
          done | tee -a result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infra-bench-prod
          path: result.txt
