# 매매 봇 예제(app/trade-bot) 테스트. 맥·Windows·리눅스에서 같은 코드가 돌므로 세 운영체제에서 모두 돌린다.
name: trade-bot-ci

on:
  pull_request:
    paths:
      - "app/trade-bot/**"
      - ".github/workflows/trade-bot-ci.yml"
  push:
    branches: [develop]
    paths:
      - "app/trade-bot/**"
      - ".github/workflows/trade-bot-ci.yml"

permissions:
  contents: read

concurrency:
  group: trade-bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/trade-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 테스트
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -t . -v
