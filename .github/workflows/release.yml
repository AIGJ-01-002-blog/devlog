# CHANGELOG.md 맨 위 버전으로 태그와 GitHub Release를 만든다. 이미 있는 태그면 아무것도 하지 않는다.
name: release

# ─── 동작 요약 ───────────────────────────────────────────────
# 언제 도나: main에 CHANGELOG.md가 바뀐 push(develop→main 릴리스 PR 머지 또는 hotfix PR 머지)가 오거나 손으로 실행할 때
# 흐름: CHANGELOG 맨 위 버전·노트 읽기 → 이전 태그 이후 머지된 PR 표 붙이기 → 태그 vX.Y.Z와 GitHub Release 만들기 → 알림
# 배포는 하지 않는다. 같은 main push에 app/**·deploy/**·deploy.yml 변경이 있을 때만 블로그 배포(deploy.yml)가 따로 돈다
# (릴리스 PR은 app/ 버전을 올리므로 배포도 돈다. CHANGELOG.md만 바뀐 push에서는 배포가 돌지 않는다)
# ────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

# 태그와 릴리스를 만들어야 해서 contents: write
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1) 코드 받기. 이전 태그를 찾으려고 전체 이력(fetch-depth: 0)을 받는다
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # 2) CHANGELOG.md 맨 위 '## [x.y.z]'에서 버전을 꺼내고, 다음 버전 제목 전까지를 release-notes.md로 잘라 낸다
      - name: 맨 위 버전과 노트 읽기
        id: notes
        run: |
          version=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
          if [ -z "$version" ]; then echo "CHANGELOG.md에서 버전을 찾지 못했습니다" >&2; exit 1; fi
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # 3)
      # 093: 노트 끝에 이전 태그와의 비교 링크와, 그 사이 머지된 PR(번호·제목·브랜치)을 붙인다.
      # 사이트의 릴리스 노트 화면은 CHANGELOG만 읽으므로 이 자동 구획은 GitHub Release에만 들어간다.
      - name: 비교 링크와 머지된 PR 붙이기
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          if [ -z "$prev" ] || [ "$prev" = "v$VERSION" ]; then echo "이전 태그가 없어 건너뜁니다."; exit 0; fi
          # squash 머지는 "제목 (#12)", merge commit은 "Merge pull request #12 from …"으로 남는다
          prs=$(git log --format=%s "$prev..HEAD" | grep -oP '\(#\K[0-9]+(?=\)$)|^Merge pull request #\K[0-9]+' | sort -un || true)
          {
            echo
            echo '### 머지된 PR (자동)'
            if [ -n "$prs" ]; then
              echo
              echo '| PR | 제목 | 브랜치 |'
              echo '|---|---|---|'
              for n in $prs; do
                gh pr view "$n" --repo "$REPO" --json number,title,headRefName \
                  --jq '"| #\(.number) | \(.title | gsub("\\|"; "\\|")) | `\(.headRefName | gsub("\\|"; "\\|"))` |"' 2>/dev/null || echo "| #$n | | |"
              done
            else
              echo
              echo '없음'
            fi
            if ! grep -q "/compare/" release-notes.md; then
              echo
              echo "**비교:** [$prev...v$VERSION](https://github.com/$REPO/compare/$prev...v$VERSION)"
            fi
          } >> release-notes.md
          cat release-notes.md
      # 4) 같은 태그가 이미 있으면 건너뛴다(다시 돌려도 안전). 0.x 버전은 시험판(prerelease)으로 표시한다
      - name: 태그와 릴리스 만들기
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION 태그가 이미 있습니다. 건너뜁니다."
            exit 0
          fi
          prerelease=""
          case "$VERSION" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md $prerelease
          echo "created=true" >> "$GITHUB_OUTPUT"
      # 5) 이번 실행에서 릴리스를 새로 만들었을 때만 알린다
      - name: 알림 (Discord·텔레그램)
        if: steps.release.outputs.created == 'true' && (vars.DISCORD_ENABLED == 'true' || vars.TELEGRAM_ENABLED == 'true')
        uses: ./.github/actions/notify
        with:
          discord-webhook-url: ${{ vars.DISCORD_ENABLED == 'true' && secrets.DISCORD_WEBHOOK_URL || '' }}
          telegram-bot-token: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          telegram-chat-id: ${{ vars.TELEGRAM_ENABLED == 'true' && secrets.TELEGRAM_CHAT_ID || '' }}
          title: "새 버전 v${{ steps.notes.outputs.version }}"
          description: "${{ github.repository }} 릴리스"
          status: success
          url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.notes.outputs.version }}
