name: 화면 CI

on:
  pull_request:
    paths: ["app/frontend/**", ".github/workflows/frontend-ci.yml"]
  # main은 블로그 배포(deploy.yml)가 이 워크플로를 불러 배포 전에 테스트한다. 여기서는 develop만 본다
  push:
    branches: [develop]
    paths: ["app/frontend/**", ".github/workflows/frontend-ci.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: 첫 화면 무게 검사
        run: node scripts/check-bundle.mjs
