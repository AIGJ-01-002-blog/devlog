# 쇼츠 렌더 워커(app/render-worker) 테스트. 맥·Windows·리눅스에서 같은 코드가 돌므로 세 운영체제에서 모두 돌린다.
# 리눅스는 실제 ffmpeg로 영상을 만들어 확인하고, 맥·Windows는 ffmpeg가 없으면 영상 테스트를 건너뛴다.
name: render-worker-ci

on:
  pull_request:
    paths:
      - "app/render-worker/**"
      - ".github/workflows/render-worker-ci.yml"
  push:
    branches: [develop]
    paths:
      - "app/render-worker/**"
      - ".github/workflows/render-worker-ci.yml"

permissions:
  contents: read

concurrency:
  group: render-worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/render-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg·한국어 글꼴 (리눅스)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg fonts-noto-cjk
      - name: 테스트
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -t . -v

  # 견본 대본 3개(samples/)를 실제 신경망 음성(edge-tts)으로 만들어 PR에서 내려받아 들어 볼 수 있게 올린다(#277).
  # 음성 서버에 닿지 않으면 워커처럼 기기 음성으로 내려가므로 이 단계는 실패하지 않는다.
  samples:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/render-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg·한국어 글꼴·음성
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg fonts-noto-cjk espeak-ng
          python -m pip install -q -r requirements.txt
      - name: 견본 영상 만들기
        env:
          PYTHONUTF8: "1"
        run: |
          mkdir -p out
          for f in samples/*.json; do python -m devlog_render render "$f" "out/$(basename "$f" .json).mp4"; done
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-samples
          path: app/render-worker/out/*.mp4
          retention-days: 14
