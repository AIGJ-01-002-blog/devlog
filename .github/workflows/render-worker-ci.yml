# 쇼츠 렌더 워커(app/render-worker) 테스트. 맥·Windows·리눅스에서 같은 코드가 돌므로 세 운영체제에서 모두 돌린다.
# 리눅스는 실제 ffmpeg로 영상을 만들어 확인하고, 맥·Windows는 ffmpeg가 없으면 영상 테스트를 건너뛴다.
name: render-worker-ci

on:
  pull_request:
    paths:
      - "app/render-worker/**"
      - ".github/workflows/render-worker-ci.yml"
  push:
    branches: [develop]
    paths:
      - "app/render-worker/**"
      - ".github/workflows/render-worker-ci.yml"

permissions:
  contents: read

concurrency:
  group: render-worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/render-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: ffmpeg·한국어 글꼴 (리눅스)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg fonts-noto-cjk
      - name: 파이썬 패키지 (신경망 음성·캐릭터)
        run: python -m pip install -q -r requirements.txt
      - name: 테스트
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -t . -v

  # 화면을 그리는 Remotion 프로젝트(remotion/): 타입 검사 + 실제로 한 편 그려 보기(#277)
  remotion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/render-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/render-worker/remotion/package-lock.json
      - name: ffmpeg·한국어 글꼴
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg fonts-noto-cjk
          python -m pip install -q -r requirements.txt
      - name: Remotion 패키지·타입 검사
        working-directory: app/render-worker/remotion
        run: npm ci --no-audit --no-fund && npm run typecheck
      - name: 쓰는 도구의 스타·최근 릴리스·라이선스(기록용, #277)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for r in remotion-dev/remotion remotion-dev/skills airbnb/lottie-web googlefonts/noto-emoji-animation googlefonts/noto-emoji \
                   rany2/edge-tts supertone-inc/supertonic myshell-ai/MeloTTS FunAudioLLM/CosyVoice pndurette/gTTS rive-app/rive-wasm lucide-icons/lucide miukimiu/react-kawaii rive-app/rive-react EsotericSoftware/spine-runtimes; do
            curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$r" | python -c "import json,sys; d=json.load(sys.stdin); print('$r', d.get('stargazers_count'), d.get('pushed_at'), (d.get('license') or {}).get('spdx_id'), d.get('archived'))"
            curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$r/releases/latest" | python -c "import json,sys; d=json.load(sys.stdin); print('   latest release:', d.get('tag_name'), d.get('published_at'))"
          done
      - name: 실제 렌더 테스트
        env:
          PYTHONUTF8: "1"
          DEVLOG_REMOTION: "1"
          DEVLOG_REMOTION_TEST: "1"
        run: python -m unittest tests.test_remotion -v

  # 견본 대본 3개(samples/)를 Remotion 화면 + 실제 신경망 음성(edge-tts)으로 만들어 PR에서 내려받아 들어 볼 수 있게 올린다(#277).
  # 음성 서버에 닿지 않으면 워커처럼 기기 음성으로 내려가므로 이 단계는 실패하지 않는다.
  samples:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 견본 9편을 차례로 렌더한다. 룩마다 무늬·전환이 달라진 뒤로 15~20분 걸린다(2026-10-17)
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/render-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/render-worker/remotion/package-lock.json
      - name: ffmpeg·한국어 글꼴·음성·Remotion
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg fonts-noto-cjk espeak-ng
          python -m pip install -q -r requirements.txt
          (cd remotion && npm ci --no-audit --no-fund)
      - name: 견본 영상 만들기
        env:
          PYTHONUTF8: "1"
        run: |
          mkdir -p out
          for f in samples/*.json; do python -m devlog_render render "$f" "out/$(basename "$f" .json).mp4" 2>&1 | tee -a out/render.log; done
          # 인터넷 음성이 막혔을 때 나오는 컴퓨터 안 신경망 음성(supertonic) 견본
          python -m devlog_render --tts supertonic render samples/docker-volume.json out/docker-volume-offline-voice.mp4
          # 로그는 PR 화면에서 바로 보이게 요약을 주석으로 남긴다: 음성 엔진이 내려갔는지, 단어 시각을 얼마나 옮겼는지(#484)
          echo "::notice title=음성 엔진 내려감::$(grep -c '음성(' out/render.log || true)번"
          echo "::notice title=단어 시각 옮김::$(grep -o '[+-][0-9.]*초 옮겨요' out/render.log | sort | uniq -c | tr '\n' ' ')"
          for v in out/*.mp4; do echo "::notice title=$(basename "$v")::$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$v")초"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shorts-samples
          path: app/render-worker/out/*.mp4
          retention-days: 14
