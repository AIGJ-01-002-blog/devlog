# 쇼츠 렌더 워커(app/render-worker) 테스트. 맥·Windows·리눅스에서 같은 코드가 돌므로 세 운영체제에서 모두 돌린다.
# 리눅스는 실제 ffmpeg로 영상을 만들어 확인하고, 맥·Windows는 ffmpeg가 없으면 영상 테스트를 건너뛴다.
name: render-worker-ci

on:
  pull_request:
    paths:
      - "app/render-worker/**"
      - ".github/workflows/render-worker-ci.yml"
  push:
    branches: [develop]
    paths:
      - "app/render-worker/**"
      - ".github/workflows/render-worker-ci.yml"

permissions:
  contents: read

concurrency:
  group: render-worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/render-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg·한국어 글꼴 (리눅스)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg fonts-noto-cjk
      - name: 테스트
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -t . -v
