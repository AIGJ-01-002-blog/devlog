spring:
  application:
    name: blog
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blog}
    username: ${DB_USERNAME:blog}
    password: ${DB_PASSWORD:blog}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    # 공용 DB는 정해진 스키마만 쓸 수 있다 (Crowfoot DB는 DB_URL의 currentSchema와 같은 값). 스키마를 새로 만들지 않는다
    default-schema: ${DB_SCHEMA:public}
    schemas: ${DB_SCHEMA:public}
    create-schemas: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 1s
      connect-timeout: 1s
  session:
    timeout: 14d
    # Boot 4는 spring.session.data.redis.* (예전 spring.session.redis.*는 무시된다)
    # indexed: 회원 번호로 세션을 찾아 비밀번호 변경·재설정 때 다른 기기를 로그아웃시킨다 (004 FR-025·FR-032)
    data:
      redis:
        namespace: blog:session
        repository-type: indexed
        # 공용 Redis는 CONFIG 명령을 막을 수 있어 키 만료 알림 설정을 건드리지 않는다 (만료 세션 색인은 정리 작업이 지운다)
        configure-action: none
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:local-dev-client}
            client-secret: ${GITHUB_CLIENT_SECRET:local-dev-secret}
            scope: read:user,user:email
            # 콜백 주소는 요청이 아니라 사이트 주소로 만든다. 프록시 뒤에서 안쪽 http 요청을 보고 http://로 보내면 GitHub이 거절한다
            redirect-uri: "${blog.site.base-url}/login/oauth2/code/{registrationId}"
          # Google은 GOOGLE_CLIENT_ID(·SECRET), 카카오는 KAKAO_CLIENT_ID(·SECRET·SCOPES), Facebook은 FACEBOOK_CLIENT_ID(·SECRET), 네이버는 NAVER_CLIENT_ID(·SECRET)가 있을 때 OAuthClientsConfig가 더한다
  # 메일 (004): SMTP_HOST가 있으면 SMTP로 보내고, 비어 있으면 보내지 않고 보관한다 (개발은 /api/dev/mails)
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      enabled: false
  mvc:
    problemdetails:
      enabled: false

server:
  shutdown: graceful
  # 글 HTML·JSON·JS·CSS·RSS를 gzip으로 보낸다(ingress-nginx는 기본으로 압축하지 않는다). 1KB 미만은 압축 이득보다 비용이 크다
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,application/rss+xml,application/xml,image/svg+xml
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
        name: BLOGSESSION
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 쿠버네티스 프로브: /actuator/health/liveness, /actuator/health/readiness
      probes:
        enabled: true
      show-details: never
  health:
    # 메일 서버 상태로 앱이 내려가지 않게 한다 (메일은 실패해도 기록만 하고 다시 보내기로 받을 수 있다)
    mail:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

blog:
  # 운영자 계정 (062): 이 블로그 주소(handle)나 GitHub 회원 번호의 계정을 앱이 뜰 때 관리자로 올린다. 비우면 아무도 올리지 않는다(비밀값 아님)
  owner:
    handle: ${OWNER_HANDLE:}
    github-id: ${OWNER_GITHUB_ID:}
  # 구글 애드센스 게시자 ID (076). 페이지 소스에 보이는 공개 값이다(비밀값 아님). ADSENSE_CLIENT를 비우면 광고 코드·ads.txt를 끈다
  adsense:
    client: ${ADSENSE_CLIENT:ca-pub-5861067712842534}
  site:
    base-url: ${SITE_BASE_URL:http://localhost:8080}
    name: devlog
    default-og-image: /og-default.png
  web:
    # 로드 밸런서(신뢰 프록시) 내부 대역. 이 대역에서 온 요청만 X-Forwarded-For를 믿는다 (docs/02 §5 H4)
    trusted-proxies: ${TRUSTED_PROXIES:}
  agreements:
    terms-version: "2026-10-07"
    terms-effective-date: "2026-10-07"
    # 2026-10-10: 처리방침 "7. 광고와 쿠키"(076)를 더해 버전을 올렸다. 기존 회원은 다음 로그인 때 재동의한다 (077)
    privacy-version: "2026-10-10"
    privacy-effective-date: "2026-10-10"
  auth:
    pending-signup-ttl: 10m
    login-rate-limit-per-minute: 20
    availability-rate-limit-per-minute: 30
    verify-token-ttl: 24h
    reset-token-ttl: 30m
    login-lock-threshold: 5
    login-lock-duration: 15m
    mail-from: ${MAIL_FROM:devlog <no-reply@devlog.local>}
    # 가입 화면 이메일 인증번호 (065): auto면 SMTP가 설정됐을 때(또는 개발 환경) 인증을 마쳐야 가입된다
    signup-email-code: ${SIGNUP_EMAIL_CODE:auto}
  handle:
    auto-body-max-length: 16
    reserved: [admin, administrator, root, system, official, support, help, about, terms, privacy,
               api, login, logout, signup, settings, me, write, search, tag, tags, notifications, manage,
               static, assets, images, mail, www, blog, user, users, "null", undefined, devlog, teamblog]
  nickname:
    change-cooldown: 30d
    reserved: [관리자, 운영자, 운영진, 운영팀, 고객센터, 공식, 매니저, 스태프,
               admin, administrator, official, staff, manager, system, root]
  cursor:
    secret: ${CURSOR_SECRET:local-cursor-secret-change-me}
  dev-login:
    enabled: ${DEV_LOGIN_ENABLED:false}
  # 사진 공개 주소. 본문 정화 허용 목록·CSP가 함께 쓴다. 로컬 저장소면 앱이 /media로 내려준다
  image:
    public-base-url: ${IMAGE_PUBLIC_BASE_URL:${blog.site.base-url}/media}
  # 사진 저장소 (005·009): S3_ENDPOINT가 있으면 MinIO(S3 API), 없으면 로컬 폴더
  storage:
    local-dir: ${MEDIA_LOCAL_DIR:${java.io.tmpdir}/blog-media}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:blog-images}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  # 조회수 (spec 013): 같은 방문자·같은 글은 window 안에 max-per-window번만 센다. 모은 조회는 flush-interval마다 post_view로 옮긴다
  view:
    window: ${VIEW_WINDOW:24h}
    max-per-window: ${VIEW_MAX_PER_WINDOW:1}
    per-minute: 60
    flush-interval: 60s
  # 검색 (spec 014): 최근 공개 글 recent-window개 안에서 먼저 찾고, 모자라면 인덱스로 전체에서 찾는다
  search:
    recent-window: 3000
    per-minute: 30
    # 하이브리드 검색 (spec 054): 키워드 결과와 의미 검색(pgvector) 결과를 순위 섞기(RRF)로 합친다.
    # 임베딩은 서버 안 Ollama(EMBED_BASE_URL) → 집 PC(OLLAMA_BASE_URL) → Gemini 순으로 설정된 것 하나를 쓴다.
    # 공급자가 없거나 DB에 pgvector가 없으면 키워드 검색만 쓴다
    semantic:
      enabled: ${SEARCH_SEMANTIC_ENABLED:true}
      provider: ${SEARCH_EMBED_PROVIDER:auto}
      base-url: ${EMBED_BASE_URL:}
      local-model: ${EMBED_MODEL:bge-m3}
      # 검색창을 열 때 임베딩 모델 예열(design/66): 요청 시간 제한, 여러 사람이 열어도 이 간격에 한 번
      warm-timeout: 30s
      warm-every: 60s
  # 주제 브랜치 (spec 072): 시리즈에 없는 공개 글을 태그·임베딩으로 묶는 간격과 기준
  topic:
    enabled: ${TOPIC_ENABLED:true}
    index-interval: 10m
    max-posts: 2000
    max-size: 12
    min-tag-similarity: 0.5
    distance-factor: 0.6
    neighbors: 5
    # 2단계: 발행 창 브랜치 추천 기준(이 글 태그 희소도 중 겹치는 비율), 글 화면 비슷한 글 수
    suggest-min-score: 0.4
    similar-limit: 4
  # 시리즈 (spec 024 FR-003): 회원당 시리즈 수, 시리즈당 글 수
  series:
    max-per-member: 100
    max-posts: 200
  # 쇼츠 스튜디오 (spec 099, 목표 v2.0.0): 2.0.0 릴리스 전까지 꺼 둔다. 워커 토큰은 실행 환경 비밀값으로만 넣는다
  shorts:
    enabled: ${SHORTS_ENABLED:false}
    worker-token: ${SHORTS_WORKER_TOKEN:}
    # 토큰을 바꿀 때: 새 값을 SHORTS_WORKER_TOKEN에, 옛 값을 여기에 두고 워커를 새 값으로 바꾼 뒤 비운다 (#241)
    previous-worker-token: ${SHORTS_WORKER_TOKEN_PREVIOUS:}
    max-video: 20MB
    daily-renders: 10
    render-timeout: 15m
    max-attempts: 3
  # 매매 일지 (#243, 목표 v2.0.0): 2.0.0 릴리스 전까지 꺼 둔다. 봇은 개인 쓰기 토큰으로 MCP record_trade를 부른다
  trades:
    enabled: ${TRADES_ENABLED:false}
    daily-records: 500
  # 블로그 포인트 (#266, 목표 v2.2.0): 출석·글 발행·모의투자 수익으로 쌓고 상점에서 쓴다. v2.2.0 릴리스 전까지 꺼 둔다.
  # 적립 규칙 값은 관리자 화면(/admin/points)에서 바꾼다
  points:
    enabled: ${POINTS_ENABLED:false}
  # AI (spec 018·052): 집 PC Ollama가 설정돼 있고 켜져 있으면 먼저, 꺼졌거나 바쁘면 외부 AI(Gemini 무료 등급).
  # AI_PREFER=gemini면 예전처럼 Gemini 먼저, 한도면 Ollama. 둘 다 비어 있으면 기능이 꺼진다
  ai:
    enabled: ${AI_ENABLED:true}
    prefer: ${AI_PREFER:local}
    user-daily-limit: 20
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
      daily-limit: ${GEMINI_DAILY_LIMIT:450}
      timeout: 10s
      max-chars: 8000
    local:
      base-url: ${OLLAMA_BASE_URL:}
      model: ${OLLAMA_MODEL:qwen2.5:3b}
      timeout: 30s
      max-chars: 2000
      concurrency: ${OLLAMA_CONCURRENCY:1}
      # 집 PC를 Cloudflare Tunnel로 열 때의 접근 토큰 (실행 환경 비밀값으로만)
      auth-token: ${OLLAMA_AUTH_TOKEN:}
      access-client-id: ${OLLAMA_ACCESS_CLIENT_ID:}
      access-client-secret: ${OLLAMA_ACCESS_CLIENT_SECRET:}
      down-for: ${OLLAMA_DOWN_FOR:60s}
  # 트렌딩 (spec 017): 10분마다 한 서버가 상위 100개 순위표를 만들어 30분 보관
  # 신고 (spec 019): 처리된 지 30일 지난 사건의 스냅샷·설명 비우기
  report:
    purge-cron: "0 10 5 * * *"
  # 회원 탈퇴 (spec 020): 신청 30일 뒤 매일 04:50(KST) 한 서버가 정리
  account:
    withdraw-purge-cron: "0 50 4 * * *"
  trending:
    cron: "0 */10 * * * *"
    keep: 30m
  # 알림 (spec 015): 커밋 뒤 따로 처리. 90일·1인 1,000개 보관, 매일 04:30(KST) 정리
  notification:
    async: true
    queue-capacity: 1000
    retention: 90d
    max-per-member: 1000
    cleanup-cron: "0 30 4 * * *"
  # 디스코드 웹훅 알림 (078): 회원이 자기 채널의 웹훅 주소를 넣는다. 서버 쪽 키는 없다
  discord:
    enabled: ${DISCORD_NOTIFY_ENABLED:true}
  # 텔레그램 연결 (spec 023): 봇 토큰이 비어 있거나 TELEGRAM_ENABLED=false면 꺼진다. 알림 보내기·메모로 임시글
  telegram:
    enabled: ${TELEGRAM_ENABLED:true}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    # MEMBERS(기본, 회원 누구나) 또는 ADMINS(관리자만). 078에서 민서님 확인 요청으로 회원 누구나로 바꿈
    audience: ${TELEGRAM_AUDIENCE:MEMBERS}
