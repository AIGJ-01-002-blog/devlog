blog:
  # 쇼츠 스튜디오(099)는 시험에서 켠다. 꺼졌을 때는 ShortsDisabledTest가 본다. 응답 없는 렌더 되돌리기는 시험이 직접 부른다
  shorts:
    enabled: true
    worker-token: test-render-token
    # 토큰을 바꾸는 동안 받는 옛 토큰 (#241)
    previous-worker-token: test-render-token-old
    timeout-check-interval: 1h
  dev-login:
    enabled: true
  cursor:
    secret: test-cursor-secret
  post:
    # 테스트는 자동 저장을 연달아 보내므로 간격 제한을 끈다 (제한 자체는 PostLimitsTest가 확인)
    autosave-min-interval: 0s
    # 예약 작업은 테스트가 직접 부른다
    autosave-flush-interval: 1h
    empty-draft-cleanup-cron: "-"
    trash-purge-cron: "-"
  view:
    flush-interval: 1h
  # 알림 정리 작업은 테스트가 직접 부른다. 알림 자체는 운영과 같이 비동기(IntegrationTest.drain으로 기다림)
  notification:
    cleanup-cron: "-"
  # 최근창을 줄여 인덱스 후보 경로도 시험한다 (014)
  search:
    recent-window: 5
    # 하이브리드(054)는 HybridSearchTest가 켜서 본다. 다른 검색 시험은 키워드 결과만 본다. 임베딩 작업은 테스트가 직접 부른다
    semantic:
      enabled: false
      index-interval: 1h
  # 주제 브랜치(072)는 테스트가 runOnce로 직접 묶는다. 예약 실행이 시험 도중 예전 결과로 덮어쓰지 않게 끈다
  topic:
    enabled: false
  # 순위표는 테스트가 직접 만든다 (017)
  trending:
    cron: "-"
  report:
    purge-cron: "-"
  account:
    withdraw-purge-cron: "-"
  # 가입 화면 인증번호(065)는 SignupEmailCodeTest가 켜서 본다. 다른 시험은 가입 뒤 링크 인증(004)을 탄다
  auth:
    signup-email-code: "off"
  # AI 태그 추천 (018): 주소는 가짜 공급자(IntegrationTest), 열쇠값은 시험용.
  # 기존 시험은 외부 AI 먼저를 본다. 집 PC 먼저(운영 기본)는 AiLocalFirstTest가 본다
  ai:
    prefer: gemini
    gemini:
      api-key: test-gemini-key
      timeout: 2s
    local:
      timeout: 2s
  # 텔레그램 (023): 주소는 가짜 봇 서버(IntegrationTest), 업데이트는 테스트가 직접 넣는다
  telegram:
    bot-token: test-bot-token
    poll: false
    audience: MEMBERS
  media:
    profile-cleanup-cron: "-"
    post-image-cleanup-cron: "-"
logging:
  level:
    root: WARN
    com.team.blog: INFO
