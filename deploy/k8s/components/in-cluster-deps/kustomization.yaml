# 학교 공용 서버 대신 클러스터 안에 PostgreSQL·Redis·MinIO와 검색용 임베딩 모델(Ollama)을 함께 띄우는 부품.
# 계정·비밀번호는 앱 Secret(blog-app-secret)의 같은 값을 그대로 쓴다:
#   DB_USERNAME/DB_PASSWORD → PostgreSQL, REDIS_PASSWORD → Redis, S3_ACCESS_KEY/S3_SECRET_KEY → MinIO
# 사진은 앱과 같은 주소의 /<버킷>/ 경로로 내려준다 (인그레스 → MinIO, 버킷은 파일 받기만 공개, 목록 조회는 막음).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - postgres.yaml
  - redis.yaml
  - minio.yaml
  - networkpolicy.yaml
  - pg-backup.yaml
  - ollama-embed.yaml
patches:
  # 앱이 뜨기 전에 사진 버킷을 만들고 파일 받기만 공개한다 (이미 있으면 정책만 다시 맞춤)
  - target: {kind: Deployment, name: blog-app}
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: ensure-bucket
            image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
            command: ["sh", "-c"]
            args:
              - |
                set -e
                export MC_CONFIG_DIR=/tmp/mc
                until mc alias set s3 "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY" >/dev/null 2>&1; do echo "MinIO 기다리는 중"; sleep 3; done
                mc mb --ignore-existing "s3/$S3_BUCKET"
                # 사진(images/, profiles/)과 쇼츠 영상(shorts/)의 파일 받기(GetObject)만 공개한다. "download" 정책은 목록 조회도 열어 비공개 글 사진 주소까지
                # 드러나므로 쓰지 않는다. 첨부파일(files/)은 공개하지 않고 앱이 글 읽기 권한을 확인한 뒤 내려준다 (022 FR-011)
                printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/images/*","arn:aws:s3:::%s/profiles/*","arn:aws:s3:::%s/shorts/*"]}]}' "$S3_BUCKET" "$S3_BUCKET" "$S3_BUCKET" > /tmp/public-read.json
                mc anonymous set-json /tmp/public-read.json "s3/$S3_BUCKET"
            envFrom:
              - configMapRef: {name: blog-app-config}
              - secretRef: {name: blog-app-secret}
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {memory: 128Mi}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            volumeMounts:
              - {name: tmp, mountPath: /tmp}
  # 사진 공개 경로: https://<사이트>/blog-images/... → MinIO
  - target: {kind: Ingress, name: blog-app}
    patch: |-
      - op: add
        path: /spec/rules/0/http/paths/-
        value:
          path: /blog-images
          pathType: Prefix
          backend:
            service:
              name: minio
              port: {name: s3}
